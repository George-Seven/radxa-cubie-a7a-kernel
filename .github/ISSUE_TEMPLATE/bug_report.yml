name: Bug report
description: Something does not work on your board
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The questions below are the ones that usually
        decide whether a problem is in this image or in the board itself —
        answering them saves a round trip.

  - type: dropdown
    id: image
    attributes:
      label: Which image or packages are you running?
      options:
        - a7a-standard (image)
        - a7a-maximum (image)
        - Packages installed onto an existing Debian 13
        - Radxa official image
        - Something else / not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: "Run: `uname -r` and `dpkg -l | grep a7a-`"
      placeholder: "6.6.98+ / a7a-board-config 1.6"
    validations:
      required: true

  - type: dropdown
    id: cooling
    attributes:
      label: Do you have active cooling fitted?
      description: >
        These images ship overclocked. A 60-second all-core load reaches 76 °C
        against an 80 °C throttle point WITH a fan. Without one, instability is
        expected rather than a bug.
      options:
        - Heatsink and fan
        - Heatsink only
        - Neither
    validations:
      required: true

  - type: input
    id: board
    attributes:
      label: Board variant
      description: RAM size, and whether it has eMMC or UFS fitted
      placeholder: "12 GB, SD only"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you expected, what happened instead.
    validations:
      required: true

  - type: dropdown
    id: official
    attributes:
      label: Does it also happen on Radxa's official image?
      description: >
        This is the single most useful thing you can tell me. If it happens
        there too, it is a board or BSP issue rather than something I introduced
        — and worth reporting to Radxa as well.
      options:
        - "Yes — happens on the official image too"
        - "No — only on this image"
        - "Have not tested"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        Useful: `sudo dmesg | tail -50`, `journalctl -p err -b`,
        `systemctl --failed`, and `a7a-clock status` if you have it.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have read the cooling requirement in the README
          required: true
        - label: I understand this software comes with no warranty and is validated on a single board
          required: true
